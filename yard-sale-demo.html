<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Yard Sale Demo</title>
<style>body{margin:0;background:#071018;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:system-ui}
canvas{border:3px solid #1e2e48;margin:12px;background:#0a1525}</style></head>
<body>
<h2 style="color:#ffcc33">YARD SALE DEMO - click canvas</h2>
<canvas id="c" width="800" height="600"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawFallenTitus(tx,ty,t){
  const wob=Math.sin(t/180)*0.04;
  ctx.save();ctx.translate(tx,ty);ctx.rotate(1.35+wob);
  ell(4,18,36,10,'rgba(0,0,0,0.22)');
  ell(-8,22,9,14,'#121212');ell(-8,22,6,11,'#222');
  ell(14,18,9,14,'#121212');ell(14,18,6,11,'#222');
  ell(-8,34,9,7,'#8b0000');ell(-8,34,6,5,'#c41e3a');
  ell(16,30,9,7,'#8b0000');ell(16,30,6,5,'#c41e3a');
  ell(0,4,28,16,'#0e0e0e');ell(0,4,24,13,'#1a1a1a');ell(0,12,16,12,'#121212');
  ell(-28,0,10,16,'#121212');ell(-28,0,7,12,'#222');
  ell(26,-6,10,16,'#121212');ell(26,-6,7,12,'#222');
  ell(2,-18,16,15,'#0e0e0e');ell(2,-18,13,12,'#1c1c1c');
  ctx.globalAlpha=0.85;ell(-4,-22,10,6,'#e8f4ff');ell(8,-14,8,5,'#d0e8f8');ell(-10,6,7,4,'#e8f4ff');ctx.globalAlpha=1;
  px(-6,-20,18,6,'#050505');px(-4,-19,6,4,'#0e2040');px(4,-19,6,4,'#0e2040');
  ctx.restore();
}
function drawDebrisItem(d){
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);
  const a=Math.max(0.15,Math.min(1,d.life/800));ctx.globalAlpha=a;
  if(d.type==='ski'){px(-28,-3,56,6,'#1a1a22');px(-26,-2,52,4,'#2a2a38');px(-30,-4,6,5,'#222230');px(22,-2,8,4,'#1a1a22');px(-20,-3,40,1,'#4a4a5a');}
  else if(d.type==='pole'){ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(0,22);ctx.stroke();px(-5,20,10,4,'#222');px(-3,-28,6,5,'#333');}
  else if(d.type==='boot'){ell(0,0,9,8,'#8b0000');ell(0,0,6,6,'#c41e3a');px(-8,4,16,5,'#6b0000');px(-2,-4,5,4,'#a01020');}
  ctx.globalAlpha=1;ctx.restore();
}
let debris=[],t0=0,running=false;
function spawn(){
  debris=[];
  const items=[{type:'ski',s:1},{type:'ski',s:-1},{type:'pole',s:0.6},{type:'pole',s:-0.7},{type:'boot',s:0.3},{type:'boot',s:-0.4}];
  for(const it of items){
    debris.push({type:it.type,x:400+(Math.random()-0.5)*20,y:300+(Math.random()-0.5)*10,
      vx:(Math.random()-0.5)*7+it.s*3,vy:-4-Math.random()*5,rot:(Math.random()-0.5)*Math.PI,rotV:(Math.random()-0.5)*0.35,life:4000});
  }
  running=true;t0=performance.now();
}
function loop(now){
  const grad=ctx.createLinearGradient(0,0,0,600);
  grad.addColorStop(0,'#5a8ab8');grad.addColorStop(1,'#e4f0fa');
  ctx.fillStyle=grad;ctx.fillRect(0,0,800,600);
  if(running){
    for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.vy+=0.18;d.rot+=d.rotV;d.vx*=0.995;if(d.y>520){d.y=520;d.vy*=-0.25;d.vx*=0.7;}}
    const t=now-t0;
    ell(400,340,48,14,'rgba(200,220,240,0.35)');
    drawFallenTitus(400,300,t);
    for(const d of debris) drawDebrisItem(d);
    ctx.fillStyle='rgba(8,14,28,0.72)';px(120,40,560,90);
    ctx.fillStyle='#ff3838';ctx.font='bold 42px system-ui';ctx.textAlign='center';
    ctx.fillText('YARD SALE...',400,90);
    ctx.fillStyle='#fff';ctx.font='18px system-ui';
    ctx.fillText('Skis everywhere. Face full of snow.',400,120);
    ctx.fillStyle='#bbb';ctx.font='15px system-ui';ctx.fillText('Click again to respawn wipeout',400,560);
  } else {
    ctx.fillStyle='#ffcc33';ctx.font='24px system-ui';ctx.textAlign='center';
    ctx.fillText('Click to trigger YARD SALE faceplant',400,300);
  }
  requestAnimationFrame(loop);
}
canvas.onclick=()=>spawn();
requestAnimationFrame(loop);
</script></body></html>
