<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Ape Ski Escape</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#071018;color:#ffcc33;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
#st{opacity:.9}
</style>
</head>
<body>
<p id="st">Loading Full Ape Ski Escape…</p>
<script>
(async function() {
  const st = document.getElementById('st');
  try {
    const base = 'https://cdn.jsdelivr.net/gh/davey-fresh/full-ape-ski-escape@main/';
    const n = 4;
    const parts = [];
    for (let i = 0; i < n; i++) {
      st.textContent = 'Loading… ' + (i+1) + '/' + n;
      const r = await fetch(base + 'g' + i + '.txt');
      if (!r.ok) throw new Error('chunk ' + i + ' HTTP ' + r.status);
      parts.push(await r.text());
    }
    const b64 = parts.join('').replace(/\s+/g, '');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.textContent = 'Load failed: ' + e;
    console.error(e);
  }
})();
</script>
</body>
</html>
