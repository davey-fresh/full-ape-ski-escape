<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Full Ape Ski Escape</title></head>
<body>
<p id="s" style="font-family:system-ui;color:#ccc;background:#071018;margin:0;padding:20px">Loading v0.14...</p>
<script>
(async () => {
  const files = ['chunk0.txt','chunk1.txt','chunk2.txt','chunk3.txt'];
  let b64 = '';
  for (const f of files) {
    try {
      const r = await fetch(f);
      if (!r.ok) throw new Error(f + ' ' + r.status);
      b64 += await r.text();
    } catch(e) {
      document.getElementById('s').textContent = 'Chunk load failed, opening last good build...';
      location.href = 'https://htmlpreview.github.io/?https://github.com/davey-fresh/full-ape-ski-escape/blob/b08f808b5c3a52fa36df6541198ec180b5a65d24/full-ape-ski-escape.html';
      return;
    }
  }
  document.open();
  document.write(atob(b64));
  document.close();
})();
</script>
</body>
</html>
