<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Full Ape Ski Escape</title></head>
<body style="margin:0;background:#071018;color:#aaa;font-family:system-ui;padding:16px">
<p id="s">Loading v0.15...</p>
<script>
(async()=>{
  async function load(p){
    for(const u of [p,'https://cdn.jsdelivr.net/gh/davey-fresh/full-ape-ski-escape@main/'+p,'https://raw.githubusercontent.com/davey-fresh/full-ape-ski-escape/main/'+p]){
      try{const r=await fetch(u+(u.startsWith('http')?'?t='+Date.now():''));if(r.ok){const t=(await r.text()).trim();if(t.length>100)return t}}catch(e){}
    }return null;
  }
  const a=await load('ga.b64'),b=await load('gb.b64');
  if(!a||!b){document.getElementById('s').textContent='Failed to load. Try hard refresh.';return}
  document.open();document.write(atob(a+b));document.close();
})();
</script></body></html>
